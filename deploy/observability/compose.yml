name: project-balloon-observability

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [project-balloon]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [project-balloon]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    mem_limit: ${LOKI_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [project-balloon]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    mem_limit: ${PROMTAIL_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [project-balloon]
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}
    mem_limit: ${POSTGRES_EXPORTER_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [project-balloon]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [project-balloon]
    restart: unless-stopped

networks:
  project-balloon:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
