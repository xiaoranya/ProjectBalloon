name: project-balloon-app

services:
  api:
    image: ${PROJECT_BALLOON_API_IMAGE:-project-balloon-api:0.1.0}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      RUST_LOG: ${RUST_LOG:-project_balloon_api=info}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PROJECT_BALLOON_API_BIND: ${PROJECT_BALLOON_API_BIND:-0.0.0.0:8080}
      PROJECT_BALLOON_DEPLOYMENT_MODE: ${PROJECT_BALLOON_DEPLOYMENT_MODE:-standard}
      PROJECT_BALLOON_TRUSTED_PROXY_CIDRS: ${PROJECT_BALLOON_TRUSTED_PROXY_CIDRS:?set the CIDR(s) of the web reverse proxy}
      PROJECT_BALLOON_RUN_MIGRATIONS: ${PROJECT_BALLOON_RUN_MIGRATIONS:-true}
      PROJECT_BALLOON_SESSION_TTL_SECONDS: ${PROJECT_BALLOON_SESSION_TTL_SECONDS:-43200}
      PROJECT_BALLOON_SECURE_COOKIES: ${PROJECT_BALLOON_SECURE_COOKIES:-true}
      PROJECT_BALLOON_CSRF_SECRET: ${PROJECT_BALLOON_CSRF_SECRET:?set PROJECT_BALLOON_CSRF_SECRET}
      PROJECT_BALLOON_ALLOW_DEV_CSRF_SECRET: ${PROJECT_BALLOON_ALLOW_DEV_CSRF_SECRET:-false}
      PROJECT_BALLOON_DATABASE_MAX_CONNECTIONS: ${PROJECT_BALLOON_DATABASE_MAX_CONNECTIONS:-20}
      PROJECT_BALLOON_DATABASE_ACQUIRE_TIMEOUT_SECONDS: ${PROJECT_BALLOON_DATABASE_ACQUIRE_TIMEOUT_SECONDS:-5}
      PROJECT_BALLOON_READINESS_TIMEOUT_MILLISECONDS: ${PROJECT_BALLOON_READINESS_TIMEOUT_MILLISECONDS:-1000}
      PROJECT_BALLOON_REALTIME_DISPATCHER_ENABLED: ${PROJECT_BALLOON_REALTIME_DISPATCHER_ENABLED:-true}
      PROJECT_BALLOON_REALTIME_CHANNEL_CAPACITY: ${PROJECT_BALLOON_REALTIME_CHANNEL_CAPACITY:-1024}
      PROJECT_BALLOON_REALTIME_POLL_MILLISECONDS: ${PROJECT_BALLOON_REALTIME_POLL_MILLISECONDS:-250}
      PROJECT_BALLOON_REALTIME_LEASE_SECONDS: ${PROJECT_BALLOON_REALTIME_LEASE_SECONDS:-30}
      PROJECT_BALLOON_REALTIME_RETRY_BASE_MILLISECONDS: ${PROJECT_BALLOON_REALTIME_RETRY_BASE_MILLISECONDS:-1000}
      PROJECT_BALLOON_REALTIME_BATCH_SIZE: ${PROJECT_BALLOON_REALTIME_BATCH_SIZE:-100}
      PROJECT_BALLOON_REALTIME_MAX_ATTEMPTS: ${PROJECT_BALLOON_REALTIME_MAX_ATTEMPTS:-8}
      PROJECT_BALLOON_REALTIME_REDIS_ENABLED: ${PROJECT_BALLOON_REALTIME_REDIS_ENABLED:-true}
      PROJECT_BALLOON_REALTIME_REDIS_CHANNEL: ${PROJECT_BALLOON_REALTIME_REDIS_CHANNEL:-xcpc:realtime:events}
      PROJECT_BALLOON_REALTIME_REDIS_RECONNECT_MILLISECONDS: ${PROJECT_BALLOON_REALTIME_REDIS_RECONNECT_MILLISECONDS:-1000}
      PROJECT_BALLOON_SCOREBOARD_CACHE_ENABLED: ${PROJECT_BALLOON_SCOREBOARD_CACHE_ENABLED:-true}
      PROJECT_BALLOON_SCOREBOARD_CACHE_TTL_SECONDS: ${PROJECT_BALLOON_SCOREBOARD_CACHE_TTL_SECONDS:-30}
      PROJECT_BALLOON_SCOREBOARD_CACHE_TIMEOUT_MILLISECONDS: ${PROJECT_BALLOON_SCOREBOARD_CACHE_TIMEOUT_MILLISECONDS:-200}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      PROJECT_BALLOON_OBJECT_STORAGE_ENABLED: ${PROJECT_BALLOON_OBJECT_STORAGE_ENABLED:-true}
      PROJECT_BALLOON_OBJECT_STORAGE_ENDPOINT: ${PROJECT_BALLOON_OBJECT_STORAGE_ENDPOINT:?set object storage endpoint}
      PROJECT_BALLOON_OBJECT_STORAGE_REGION: ${PROJECT_BALLOON_OBJECT_STORAGE_REGION:-us-east-1}
      PROJECT_BALLOON_OBJECT_STORAGE_ACCESS_KEY: ${PROJECT_BALLOON_OBJECT_STORAGE_ACCESS_KEY:?set object storage access key}
      PROJECT_BALLOON_OBJECT_STORAGE_SECRET_KEY: ${PROJECT_BALLOON_OBJECT_STORAGE_SECRET_KEY:?set object storage secret key}
      PROJECT_BALLOON_OBJECT_STORAGE_PROBLEM_BUCKET: ${PROJECT_BALLOON_OBJECT_STORAGE_PROBLEM_BUCKET:-xcpc-problems}
      PROJECT_BALLOON_OBJECT_STORAGE_SOURCE_BUCKET: ${PROJECT_BALLOON_OBJECT_STORAGE_SOURCE_BUCKET:-xcpc-sources}
      PROJECT_BALLOON_OBJECT_STORAGE_FORCE_PATH_STYLE: ${PROJECT_BALLOON_OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      PROJECT_BALLOON_OBJECT_STORAGE_REQUEST_TIMEOUT_MILLISECONDS: ${PROJECT_BALLOON_OBJECT_STORAGE_REQUEST_TIMEOUT_MILLISECONDS:-5000}
      PROJECT_BALLOON_OBJECT_CLEANUP_POLL_MILLISECONDS: ${PROJECT_BALLOON_OBJECT_CLEANUP_POLL_MILLISECONDS:-5000}
      PROJECT_BALLOON_OBJECT_CLEANUP_LEASE_SECONDS: ${PROJECT_BALLOON_OBJECT_CLEANUP_LEASE_SECONDS:-30}
      PROJECT_BALLOON_OBJECT_CLEANUP_RETRY_BASE_MILLISECONDS: ${PROJECT_BALLOON_OBJECT_CLEANUP_RETRY_BASE_MILLISECONDS:-1000}
      PROJECT_BALLOON_OBJECT_CLEANUP_BATCH_SIZE: ${PROJECT_BALLOON_OBJECT_CLEANUP_BATCH_SIZE:-50}
      PROJECT_BALLOON_CUPS_ENABLED: ${PROJECT_BALLOON_CUPS_ENABLED:-false}
      PROJECT_BALLOON_CUPS_PRINTER: ${PROJECT_BALLOON_CUPS_PRINTER:-xcpc}
      PROJECT_BALLOON_CUPS_COMMAND_TIMEOUT_MILLISECONDS: ${PROJECT_BALLOON_CUPS_COMMAND_TIMEOUT_MILLISECONDS:-5000}
      PROJECT_BALLOON_RABBITMQ_ENABLED: ${PROJECT_BALLOON_RABBITMQ_ENABLED:-true}
      PROJECT_BALLOON_RABBITMQ_URL: ${PROJECT_BALLOON_RABBITMQ_URL:?set RabbitMQ URL}
      PROJECT_BALLOON_RABBITMQ_REQUEST_TIMEOUT_MILLISECONDS: ${PROJECT_BALLOON_RABBITMQ_REQUEST_TIMEOUT_MILLISECONDS:-5000}
      PROJECT_BALLOON_JUDGE_DISPATCH_POLL_MILLISECONDS: ${PROJECT_BALLOON_JUDGE_DISPATCH_POLL_MILLISECONDS:-500}
      PROJECT_BALLOON_JUDGE_DISPATCH_LEASE_SECONDS: ${PROJECT_BALLOON_JUDGE_DISPATCH_LEASE_SECONDS:-30}
      PROJECT_BALLOON_JUDGE_DISPATCH_RETRY_BASE_MILLISECONDS: ${PROJECT_BALLOON_JUDGE_DISPATCH_RETRY_BASE_MILLISECONDS:-1000}
      PROJECT_BALLOON_JUDGE_DISPATCH_BATCH_SIZE: ${PROJECT_BALLOON_JUDGE_DISPATCH_BATCH_SIZE:-50}
      PROJECT_BALLOON_JUDGE_DISPATCH_MAX_ATTEMPTS: ${PROJECT_BALLOON_JUDGE_DISPATCH_MAX_ATTEMPTS:-8}
      PROJECT_BALLOON_JUDGE_STUCK_REQUEUE_INTERVAL_SECONDS: ${PROJECT_BALLOON_JUDGE_STUCK_REQUEUE_INTERVAL_SECONDS:-60}
      PROJECT_BALLOON_JUDGE_RESULT_PREFETCH: ${PROJECT_BALLOON_JUDGE_RESULT_PREFETCH:-32}
      PROJECT_BALLOON_JUDGE_RESULT_RECONNECT_MILLISECONDS: ${PROJECT_BALLOON_JUDGE_RESULT_RECONNECT_MILLISECONDS:-1000}
      # Optional bearer token guarding GET /metrics; empty keeps it open.
      PROJECT_BALLOON_METRICS_TOKEN: ${PROJECT_BALLOON_METRICS_TOKEN:-}
    expose: ["8080"]
    networks: [project-balloon]
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  judge-worker:
    image: ${PROJECT_BALLOON_JUDGE_IMAGE:-project-balloon-judge-worker:0.1.0}
    build:
      context: ../..
      dockerfile: apps/judge-worker/Dockerfile
    environment:
      RUST_LOG: ${RUST_LOG:-project_balloon_judge_worker=info}
      WORKER_ID: ${WORKER_ID:-judge-worker-1}
      JUDGE_CACHE_DIR: ${JUDGE_CACHE_DIR:-/var/lib/project-balloon/judge-cache}
      JUDGE_TASK_QUEUE: ${JUDGE_TASK_QUEUE:-judge.tasks}
      JUDGE_TASK_PREFETCH: ${JUDGE_TASK_PREFETCH:-1}
      JUDGE_RECONNECT_MILLISECONDS: ${JUDGE_RECONNECT_MILLISECONDS:-1000}
      JUDGE_HEALTH_PORT: ${JUDGE_HEALTH_PORT:-9101}
      JUDGE_HEALTH_SESSION_ERROR_WINDOW_SECONDS: ${JUDGE_HEALTH_SESSION_ERROR_WINDOW_SECONDS:-60}
      JUDGE_REQUEST_TIMEOUT_MILLISECONDS: ${JUDGE_REQUEST_TIMEOUT_MILLISECONDS:-10000}
      JUDGE_HEARTBEAT_INTERVAL_SECONDS: ${JUDGE_HEARTBEAT_INTERVAL_SECONDS:-5}
      JUDGE_DOCKER_CONNECT_TIMEOUT_SECONDS: ${JUDGE_DOCKER_CONNECT_TIMEOUT_SECONDS:-10}
      JUDGE_DOCKER_API_TIMEOUT_MILLISECONDS: ${JUDGE_DOCKER_API_TIMEOUT_MILLISECONDS:-5000}
      JUDGE_MAX_ARTIFACT_BYTES: ${JUDGE_MAX_ARTIFACT_BYTES:-314572800}
      JUDGE_TESTDATA_CACHE_MAX_BYTES: ${JUDGE_TESTDATA_CACHE_MAX_BYTES:-8589934592}
      XCPC_SANDBOX_SOCKET: ${XCPC_SANDBOX_SOCKET:-/var/run/docker.sock}
      XCPC_SANDBOX_RUNTIME: ${XCPC_SANDBOX_RUNTIME:-}
      XCPC_SANDBOX_USER: ${XCPC_SANDBOX_USER:-1000:1000}
      JUDGE_C_IMAGE: ${JUDGE_C_IMAGE:-judge-runtime-c:12.2.0}
      JUDGE_CPP_IMAGE: ${JUDGE_CPP_IMAGE:-judge-runtime-cpp:12.2.0}
      JUDGE_JAVA_IMAGE: ${JUDGE_JAVA_IMAGE:-judge-runtime-java:21}
      JUDGE_PYTHON_IMAGE: ${JUDGE_PYTHON_IMAGE:-judge-runtime-python:3.12.13}
      PROJECT_BALLOON_RABBITMQ_URL: ${PROJECT_BALLOON_RABBITMQ_URL:?set RabbitMQ URL}
      PROJECT_BALLOON_OBJECT_STORAGE_ENDPOINT: ${PROJECT_BALLOON_OBJECT_STORAGE_ENDPOINT:?set object storage endpoint}
      PROJECT_BALLOON_OBJECT_STORAGE_REGION: ${PROJECT_BALLOON_OBJECT_STORAGE_REGION:-us-east-1}
      PROJECT_BALLOON_OBJECT_STORAGE_ACCESS_KEY: ${PROJECT_BALLOON_OBJECT_STORAGE_ACCESS_KEY:?set object storage access key}
      PROJECT_BALLOON_OBJECT_STORAGE_SECRET_KEY: ${PROJECT_BALLOON_OBJECT_STORAGE_SECRET_KEY:?set object storage secret key}
      PROJECT_BALLOON_OBJECT_STORAGE_PROBLEM_BUCKET: ${PROJECT_BALLOON_OBJECT_STORAGE_PROBLEM_BUCKET:-xcpc-problems}
      PROJECT_BALLOON_OBJECT_STORAGE_SOURCE_BUCKET: ${PROJECT_BALLOON_OBJECT_STORAGE_SOURCE_BUCKET:-xcpc-sources}
    volumes:
      - ${XCPC_SANDBOX_SOCKET_HOST:-/var/run/docker.sock}:${XCPC_SANDBOX_SOCKET:-/var/run/docker.sock}
      - ${JUDGE_CACHE_DIR:-/var/lib/project-balloon/judge-cache}:${JUDGE_CACHE_DIR:-/var/lib/project-balloon/judge-cache}
    group_add:
      - ${XCPC_SANDBOX_SOCKET_GID:-${DOCKER_GID:-999}}
    networks: [project-balloon]
    restart: unless-stopped
    # The worker process (not the sandbox containers) is capped at 2 GiB; the
    # on-disk testdata cache is bounded separately by JUDGE_TESTDATA_CACHE_MAX_BYTES.
    mem_limit: ${JUDGE_WORKER_MEM_LIMIT:-2g}
    cpus: ${JUDGE_WORKER_CPUS:-4}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:${JUDGE_HEALTH_PORT:-9101}/readyz"]
      interval: 30s
      timeout: 3s
      retries: 5

  web:
    image: ${PROJECT_BALLOON_WEB_IMAGE:-project-balloon-web:0.1.0}
    build:
      context: ../..
      dockerfile: frontend/web/Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [project-balloon]
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  project-balloon:
    external: true
