components:
  schemas:
    ScreenPlaylistItemRequest:
      required:
      - targetView
      type: object
      properties:
        targetView:
          type: string
          enum:
          - SCOREBOARD
          - FIRST_BLOOD
          - BALLOONS
          - FREEZE_COUNTDOWN
          - STATISTICS
          - RESOLVER
          - AWARDS
        durationSeconds:
          maximum: 3600
          minimum: 5
          type: integer
          format: int32
    ScreenPlaylistRequest:
      required:
      - items
      - name
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 0
          type: string
        loopEnabled:
          type: boolean
        items:
          maxItems: 20
          minItems: 0
          type: array
          items:
            $ref: "#/components/schemas/ScreenPlaylistItemRequest"
        expectedVersion:
          type: integer
          format: int64
    ScreenPlaylistItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        targetView:
          type: string
          enum:
          - SCOREBOARD
          - FIRST_BLOOD
          - BALLOONS
          - FREEZE_COUNTDOWN
          - STATISTICS
          - RESOLVER
          - AWARDS
        durationSeconds:
          type: integer
          format: int32
        displayOrder:
          type: integer
          format: int32
    ScreenPlaylistResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contestId:
          type: integer
          format: int64
        name:
          type: string
        loopEnabled:
          type: boolean
        version:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScreenPlaylistItemResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScreenGroupRequest:
      required:
      - instanceIds
      - name
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 0
          type: string
        instanceIds:
          maxItems: 100
          minItems: 0
          type: array
          items:
            type: integer
            format: int64
        expectedVersion:
          type: integer
          format: int64
    ScreenGroupResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contestId:
          type: integer
          format: int64
        name:
          type: string
        instanceIds:
          type: array
          items:
            type: integer
            format: int64
        playlistId:
          type: integer
          format: int64
        playbackStatus:
          type: string
          enum:
          - STOPPED
          - PLAYING
          - PAUSED
        playbackStartedAt:
          type: string
          format: date-time
        pausedElapsedSeconds:
          type: integer
          format: int64
        lockedView:
          type: string
          enum:
          - SCOREBOARD
          - FIRST_BLOOD
          - BALLOONS
          - FREEZE_COUNTDOWN
          - STATISTICS
          - RESOLVER
          - AWARDS
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpsertStatementCommand:
      type: object
      properties:
        body:
          type: string
    ProblemAttachmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        originalFilename:
          type: string
        contentType:
          type: string
        bytes:
          type: integer
          format: int64
        sha256:
          type: string
        createdAt:
          type: string
          format: date-time
    ProblemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        timeLimitMs:
          type: integer
          format: int32
        memoryLimitMb:
          type: integer
          format: int32
        outputLimitKb:
          type: integer
          format: int32
        languages:
          type: string
        testdataVersion:
          type: integer
          format: int32
        testdataSha256:
          type: string
        defaultLangCode:
          type: string
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        statements:
          type: array
          items:
            $ref: "#/components/schemas/ProblemStatementResponse"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ProblemAttachmentResponse"
    ProblemStatementResponse:
      type: object
      properties:
        langCode:
          type: string
        body:
          type: string
        updatedAt:
          type: string
          format: date-time
    PresentationConfigRequest:
      type: object
      properties:
        enabled:
          type: boolean
        title:
          type: string
        subtitle:
          type: string
        accentColor:
          type: string
