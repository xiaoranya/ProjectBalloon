[workspace]
members = [
    "apps/api",
    "apps/judge-worker",
    "crates/contracts",
    "crates/domain",
    "crates/test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.103"
ammonia = "4.1.2"
async-trait = "0.1.89"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["http1", "json", "multipart", "tokio"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bollard = "0.21.0"
bytes = "1.12.1"
getrandom = "0.4.3"
futures-util = "0.3.33"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.3"
ipnet = "2.12.0"
lapin = "4.10.0"
libc = "0.2.183"
pulldown-cmark = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "uuid",
] }
thiserror = "2.0.19"
subtle = "2.6.1"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "5.5.0", features = ["time", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

project-balloon-contracts = { path = "crates/contracts" }
project-balloon-domain = { path = "crates/domain" }
project-balloon-test-support = { path = "crates/test-support" }
redis = { version = "1.4.1", default-features = false, features = [
    "connection-manager",
    "tokio-comp",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package.sqlx-macros]
opt-level = 3
