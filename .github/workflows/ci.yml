name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly scheduled run so npm advisories in production dependencies surface
  # after merge; scheduled runs execute only the npm-audit job and skip the rest.
  schedule:
    - cron: '20 3 * * *'

concurrency:
  # The event name keeps scheduled runs in their own group so a nightly
  # npm-audit run never cancels an in-progress push or pull_request run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo fmt --all --check
      - run: cargo check-all
      - run: cargo lint
      # Environment-backed tests run in the Integration checks job; the
      # Docker-image suites stay in the scheduled/manual Docker workflow.
      - run: cargo test-all
      - name: Check committed OpenAPI runtime document is fresh
        run: |
          cargo run --quiet -p project-balloon-api --bin export-openapi > docs/api/openapi.runtime.json
          git diff --exit-code -- docs/api/openapi.runtime.json
      - name: Install SQLx CLI
        run: |
          if rg -q 'sqlx::(query|query_as|query_scalar|query_file)!' apps crates; then
            cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres
          else
            echo 'No SQLx compile-time query macros found; SQLx metadata is not required.'
          fi
      - name: Verify SQLx query metadata
        run: |
          if rg -q 'sqlx::(query|query_as|query_scalar|query_file)!' apps crates; then
            cargo sqlx prepare --check --workspace
          else
            echo 'SQLx metadata check skipped because the workspace uses runtime SQLx queries.'
          fi

  integration:
    name: Integration checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: project_balloon_test
          POSTGRES_PASSWORD: test-postgres-password
          POSTGRES_DB: project_balloon_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U project_balloon_test -d project_balloon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13.7-management
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test-rabbit
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - '5672:5672'
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.8
        env:
          RUSTFS_ACCESS_KEY: test
          RUSTFS_SECRET_KEY: test-rustfs
        ports:
          - '9000:9000'
    env:
      DATABASE_URL: postgresql://project_balloon_test:test-postgres-password@127.0.0.1:5432/project_balloon_test
      PROJECT_BALLOON_TEST_REDIS_URL: redis://127.0.0.1:6379
      PROJECT_BALLOON_TEST_AMQP_URL: amqp://test:test-rabbit@127.0.0.1:5672/test
      PROJECT_BALLOON_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PROJECT_BALLOON_TEST_S3_REGION: us-east-1
      PROJECT_BALLOON_TEST_S3_ACCESS_KEY: test
      PROJECT_BALLOON_TEST_S3_SECRET_KEY: test-rustfs
      PROJECT_BALLOON_TEST_S3_BUCKET: project-balloon-integration
      PROJECT_BALLOON_TEST_S3_PROBLEM_BUCKET: xcpc-problems
      PROJECT_BALLOON_TEST_S3_SOURCE_BUCKET: xcpc-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cups cups-filters
          echo /usr/sbin >> "$GITHUB_PATH"
          test -x /usr/sbin/cupsfilter
          test -f /usr/share/ppd/cupsfilters/Generic-PDF_Printer-PDF.ppd
      - name: Resolve Docker-backed test container names
        run: |
          redis_container="$(docker ps --filter ancestor=redis:7.4.2 --format '{{.Names}}' | head -n1)"
          rabbit_container="$(docker ps --filter ancestor=rabbitmq:3.13.7-management --format '{{.Names}}' | head -n1)"
          if [ -z "$redis_container" ] || [ -z "$rabbit_container" ]; then
            echo "Failed to discover service containers: redis='$redis_container' rabbitmq='$rabbit_container'" >&2
            docker ps --format '{{.Names}} {{.Image}}' >&2
            exit 1
          fi
          {
            echo "PROJECT_BALLOON_TEST_REDIS_CONTAINER=$redis_container"
            echo "PROJECT_BALLOON_TEST_RABBITMQ_CONTAINER=$rabbit_container"
          } >> "$GITHUB_ENV"
      - name: Create object storage test buckets
        run: |
          export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test-rustfs
          ready=0
          for _ in $(seq 1 30); do
            if aws --endpoint-url "$PROJECT_BALLOON_TEST_S3_ENDPOINT" s3api list-buckets >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" -eq 1 ] || { echo 'S3 endpoint did not become ready within 60 seconds' >&2; exit 1; }
          for bucket in "$PROJECT_BALLOON_TEST_S3_BUCKET" \
            "$PROJECT_BALLOON_TEST_S3_PROBLEM_BUCKET" "$PROJECT_BALLOON_TEST_S3_SOURCE_BUCKET"; do
            aws --endpoint-url "$PROJECT_BALLOON_TEST_S3_ENDPOINT" s3 mb "s3://$bucket" 2>/dev/null \
              || aws --endpoint-url "$PROJECT_BALLOON_TEST_S3_ENDPOINT" s3api head-bucket --bucket "$bucket"
          done
      # The Docker-image suites (sandbox_docker, pipeline_docker) stay in
      # docker-integration; everything environment-backed runs here. The two
      # RabbitMQ tests run alone and serially because the restart test bounces
      # the broker underneath any concurrently running consumer.
      - name: Workspace and API integration tests
        run: >-
          cargo test --workspace --all-features --locked
          --lib --bins
          --test archived_contest_readonly --test bootstrap_postgres --test migration_freeze
          --test object_storage_docker --test practice_postgres --test schema_status_constraints
          -- --include-ignored
      # The RabbitMQ tests publish through the reviewed Judge topology, which
      # only the API declares on startup (see judge_dispatch/topology.rs);
      # mirror docker-integration.sh by running the API briefly first. The
      # binary is started directly so the kill targets the API process itself
      # (cargo run would leave the child orphaned, still consuming results).
      - name: Declare RabbitMQ Judge topology with a brief API run
        run: |
          set -euo pipefail
          cargo build --quiet -p project-balloon-api --bin project-balloon-api
          PROJECT_BALLOON_API_BIND=127.0.0.1:18080 \
          PROJECT_BALLOON_RUN_MIGRATIONS=true \
          PROJECT_BALLOON_SECURE_COOKIES=false \
          PROJECT_BALLOON_CSRF_SECRET=test-csrf-secret-012345678901234567890123 \
          PROJECT_BALLOON_REALTIME_REDIS_ENABLED=true \
          REDIS_URL="$PROJECT_BALLOON_TEST_REDIS_URL" \
          PROJECT_BALLOON_SCOREBOARD_CACHE_ENABLED=false \
          PROJECT_BALLOON_OBJECT_STORAGE_ENABLED=true \
          PROJECT_BALLOON_OBJECT_STORAGE_ENDPOINT="$PROJECT_BALLOON_TEST_S3_ENDPOINT" \
          PROJECT_BALLOON_OBJECT_STORAGE_REGION=us-east-1 \
          PROJECT_BALLOON_OBJECT_STORAGE_ACCESS_KEY=test \
          PROJECT_BALLOON_OBJECT_STORAGE_SECRET_KEY=test-rustfs \
          PROJECT_BALLOON_RABBITMQ_ENABLED=true \
          PROJECT_BALLOON_RABBITMQ_URL="$PROJECT_BALLOON_TEST_AMQP_URL" \
            target/debug/project-balloon-api &
          api_pid=$!
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/livez >/dev/null 2>&1; then break; fi
            kill -0 "$api_pid" 2>/dev/null || { echo 'API exited before becoming live' >&2; exit 1; }
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/livez >/dev/null
          health_status=000
          for _ in $(seq 1 30); do
            health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/health)"
            [ "$health_status" = 200 ] && break
            sleep 1
          done
          [ "$health_status" = 200 ] || { echo "API readiness returned HTTP $health_status" >&2; exit 1; }
          kill -INT "$api_pid"
          wait "$api_pid"
      - name: RabbitMQ worker capacity test
        run: cargo test -p project-balloon-judge-worker --all-features --locked --test rabbit_concurrency capacity_two_runs_in_parallel_and_shutdown_drains_in_flight_tasks -- --ignored --exact --test-threads=1
      - name: Purge judge queues
        run: |
          docker exec "$PROJECT_BALLOON_TEST_RABBITMQ_CONTAINER" rabbitmqctl purge_queue judge.tasks -p test >/dev/null
          docker exec "$PROJECT_BALLOON_TEST_RABBITMQ_CONTAINER" rabbitmqctl purge_queue judge.results -p test >/dev/null
      - name: RabbitMQ broker restart test
        run: cargo test -p project-balloon-judge-worker --all-features --locked --test rabbit_concurrency broker_restart_requeues_unacknowledged_in_flight_task -- --ignored --exact --test-threads=1

  coverage:
    name: Coverage summary
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: project_balloon_test
          POSTGRES_PASSWORD: test-postgres-password
          POSTGRES_DB: project_balloon_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U project_balloon_test -d project_balloon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.8
        env:
          RUSTFS_ACCESS_KEY: test
          RUSTFS_SECRET_KEY: test-rustfs
        ports:
          - '9000:9000'
    env:
      DATABASE_URL: postgresql://project_balloon_test:test-postgres-password@127.0.0.1:5432/project_balloon_test
      PROJECT_BALLOON_TEST_REDIS_URL: redis://127.0.0.1:6379
      PROJECT_BALLOON_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PROJECT_BALLOON_TEST_S3_REGION: us-east-1
      PROJECT_BALLOON_TEST_S3_ACCESS_KEY: test
      PROJECT_BALLOON_TEST_S3_SECRET_KEY: test-rustfs
      PROJECT_BALLOON_TEST_S3_BUCKET: project-balloon-integration
      PROJECT_BALLOON_TEST_S3_PROBLEM_BUCKET: xcpc-problems
      PROJECT_BALLOON_TEST_S3_SOURCE_BUCKET: xcpc-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cups cups-filters
          echo /usr/sbin >> "$GITHUB_PATH"
          test -x /usr/sbin/cupsfilter
          test -f /usr/share/ppd/cupsfilters/Generic-PDF_Printer-PDF.ppd
      - name: Resolve Docker-backed test container names
        run: |
          redis_container="$(docker ps --filter ancestor=redis:7.4.2 --format '{{.Names}}' | head -n1)"
          if [ -z "$redis_container" ]; then
            echo 'Failed to discover the Redis service container' >&2
            docker ps --format '{{.Names}} {{.Image}}' >&2
            exit 1
          fi
          echo "PROJECT_BALLOON_TEST_REDIS_CONTAINER=$redis_container" >> "$GITHUB_ENV"
      - name: Create object storage test buckets
        run: |
          export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test-rustfs
          ready=0
          for _ in $(seq 1 30); do
            if aws --endpoint-url "$PROJECT_BALLOON_TEST_S3_ENDPOINT" s3api list-buckets >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" -eq 1 ] || { echo 'S3 endpoint did not become ready within 60 seconds' >&2; exit 1; }
          for bucket in "$PROJECT_BALLOON_TEST_S3_BUCKET" \
            "$PROJECT_BALLOON_TEST_S3_PROBLEM_BUCKET" "$PROJECT_BALLOON_TEST_S3_SOURCE_BUCKET"; do
            aws --endpoint-url "$PROJECT_BALLOON_TEST_S3_ENDPOINT" s3 mb "s3://$bucket" 2>/dev/null \
              || aws --endpoint-url "$PROJECT_BALLOON_TEST_S3_ENDPOINT" s3api head-bucket --bucket "$bucket"
          done
      # Counts every environment-backed suite except the Docker-image ones
      # (sandbox_docker, pipeline_docker) and the RabbitMQ broker-restart pair,
      # which stay exclusive to the Integration checks and Docker workflows;
      # the summary quantifies total CI-visible coverage after every PR.
      - run: >-
          cargo llvm-cov --workspace --all-features --locked --summary-only
          --lib --bins
          --test archived_contest_readonly --test bootstrap_postgres --test migration_freeze
          --test object_storage_docker --test practice_postgres --test schema_status_constraints
          -- --include-ignored

  frontend:
    name: Frontend checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies for high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run openapi:diff -- --check
      - run: npm run build

  npm-audit:
    # Scheduled-only companion to the frontend job's audit step: advisories
    # published against an already-merged lockfile still fail a workflow the
    # next night without paying for full CI.
    name: Scheduled npm audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies for high or critical advisories
        run: npm audit --omit=dev --audit-level=high

  compatibility:
    name: API compatibility snapshot
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check-api-compat.py --check

  quality:
    name: Dependency and license checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: 1.94.0

  containers:
    # On PRs this job is skipped at the step level, not the job level, so the
    # check runs still show the expanded matrix name instead of the literal
    # ${{ matrix.name }} (skipped jobs never expand their matrix).
    name: Judge runtime build (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: judge-runtime-c
            context: deploy/judge/runtimes/c
            dockerfile: Dockerfile
            image: judge-runtime-c:ci
          - name: judge-runtime-cpp
            context: deploy/judge/runtimes/cpp
            dockerfile: Dockerfile
            image: judge-runtime-cpp:ci
          - name: judge-runtime-java
            context: deploy/judge/runtimes/java
            dockerfile: Dockerfile
            image: judge-runtime-java:ci
          - name: judge-runtime-python
            context: deploy/judge/runtimes/python
            dockerfile: Dockerfile
            image: judge-runtime-python:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: github.event_name != 'pull_request'
      - name: Build image
        if: github.event_name != 'pull_request'
        run: >-
          docker buildx build --load --pull=false
          --tag "${{ matrix.image }}"
          --file "${{ matrix.context }}/${{ matrix.dockerfile }}"
          "${{ matrix.context }}"
      - name: Scan image for critical vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
      - name: Verify judge runtime image
        if: github.event_name != 'pull_request'
        run: docker run --rm --entrypoint /usr/bin/time "${{ matrix.image }}" --version

  compose:
    name: Compose configuration
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose files
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD=ci-postgres-password
          export REDIS_PASSWORD=ci-redis-password
          export RABBITMQ_PASSWORD=ci-rabbitmq-password
          export PROJECT_BALLOON_OBJECT_STORAGE_ACCESS_KEY=ci-access-key
          export PROJECT_BALLOON_OBJECT_STORAGE_SECRET_KEY=ci-rustfs-secret
          export DATABASE_URL=postgresql://ci:ci@postgres:5432/project_balloon
          export PROJECT_BALLOON_TRUSTED_PROXY_CIDRS=127.0.0.1/32
          export PROJECT_BALLOON_CSRF_SECRET=ci-csrf-secret-with-more-than-32-bytes
          export REDIS_URL=redis://:ci-redis-password@redis:6379/0
          export PROJECT_BALLOON_OBJECT_STORAGE_ENDPOINT=http://rustfs:9000
          export PROJECT_BALLOON_OBJECT_STORAGE_REGION=us-east-1
          export PROJECT_BALLOON_RABBITMQ_URL=amqp://ci:ci-rabbitmq-password@rabbitmq:5672/project_balloon
          export GRAFANA_ADMIN_PASSWORD=ci-grafana-password
          export POSTGRES_EXPORTER_DSN=postgresql://ci:ci@postgres:5432/project_balloon?sslmode=disable
          docker compose -f deploy/compose/data.docker-compose.yml config --quiet
          docker compose -f deploy/compose/rust-app.docker-compose.yml config --quiet
          docker compose -f deploy/observability/compose.yml config --quiet
