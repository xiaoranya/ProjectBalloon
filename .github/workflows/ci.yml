name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo fmt --all --check
      - run: cargo check-all
      - run: cargo lint
      # Environment-backed tests run in the scheduled/manual Docker workflow.
      - run: cargo test-all
      - name: Check committed OpenAPI runtime document is fresh
        run: |
          cargo run --quiet -p project-balloon-api --bin export-openapi > docs/api/openapi.runtime.json
          git diff --exit-code -- docs/api/openapi.runtime.json
      - name: Install SQLx CLI
        run: |
          if rg -q 'sqlx::(query|query_as|query_scalar|query_file)!' apps crates; then
            cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres
          else
            echo 'No SQLx compile-time query macros found; SQLx metadata is not required.'
          fi
      - name: Verify SQLx query metadata
        run: |
          if rg -q 'sqlx::(query|query_as|query_scalar|query_file)!' apps crates; then
            cargo sqlx prepare --check --workspace
          else
            echo 'SQLx metadata check skipped because the workspace uses runtime SQLx queries.'
          fi

  coverage:
    name: Coverage summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Environment-backed tests stay ignored here (see docker-integration);
      # the summary quantifies the CI-visible coverage after every PR.
      - run: cargo llvm-cov --workspace --all-features --locked --summary-only

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run openapi:diff -- --check
      - run: npm run build

  compatibility:
    name: API compatibility snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check-api-compat.py --check

  quality:
    name: Dependency and license checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: 1.94.0

  containers:
    name: Judge runtime build (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: judge-runtime-c
            context: deploy/judge/runtimes/c
            dockerfile: Dockerfile
            image: judge-runtime-c:ci
          - name: judge-runtime-cpp
            context: deploy/judge/runtimes/cpp
            dockerfile: Dockerfile
            image: judge-runtime-cpp:ci
          - name: judge-runtime-java
            context: deploy/judge/runtimes/java
            dockerfile: Dockerfile
            image: judge-runtime-java:ci
          - name: judge-runtime-python
            context: deploy/judge/runtimes/python
            dockerfile: Dockerfile
            image: judge-runtime-python:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        run: >-
          docker buildx build --load --pull=false
          --tag "${{ matrix.image }}"
          --file "${{ matrix.context }}/${{ matrix.dockerfile }}"
          "${{ matrix.context }}"
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
      - name: Verify judge runtime image
        if: startsWith(matrix.name, 'judge-runtime-')
        run: docker run --rm --entrypoint /usr/bin/time "${{ matrix.image }}" --version

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose files
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD=ci-postgres-password
          export REDIS_PASSWORD=ci-redis-password
          export RABBITMQ_PASSWORD=ci-rabbitmq-password
          export PROJECT_BALLOON_OBJECT_STORAGE_ACCESS_KEY=ci-access-key
          export PROJECT_BALLOON_OBJECT_STORAGE_SECRET_KEY=ci-rustfs-secret
          export DATABASE_URL=postgresql://ci:ci@postgres:5432/project_balloon
          export PROJECT_BALLOON_TRUSTED_PROXY_CIDRS=127.0.0.1/32
          export PROJECT_BALLOON_CSRF_SECRET=ci-csrf-secret-with-more-than-32-bytes
          export REDIS_URL=redis://:ci-redis-password@redis:6379/0
          export PROJECT_BALLOON_OBJECT_STORAGE_ENDPOINT=http://rustfs:9000
          export PROJECT_BALLOON_OBJECT_STORAGE_REGION=us-east-1
          export PROJECT_BALLOON_RABBITMQ_URL=amqp://ci:ci-rabbitmq-password@rabbitmq:5672/project_balloon
          export GRAFANA_ADMIN_PASSWORD=ci-grafana-password
          export POSTGRES_EXPORTER_DSN=postgresql://ci:ci@postgres:5432/project_balloon?sslmode=disable
          docker compose -f deploy/compose/data.docker-compose.yml config --quiet
          docker compose -f deploy/compose/rust-app.docker-compose.yml config --quiet
          docker compose -f deploy/observability/compose.yml config --quiet
