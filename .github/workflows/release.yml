name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # This is the only platform currently tested end to end.
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_target: linux-amd64
            package_kind: deployment
            runtime_images: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_target: linux-arm64
            package_kind: deployment
            runtime_images: true
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            package_target: macos-x86_64
            package_kind: portable
            runtime_images: false
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            package_target: macos-arm64
            package_kind: portable
            runtime_images: false
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            package_target: windows-x86_64
            package_kind: portable
            runtime_images: false
    defaults:
      run:
        shell: bash
    env:
      PROJECT_BALLOON_BINARY_TARGET: ${{ matrix.target }}
      PROJECT_BALLOON_PACKAGE_TARGET: ${{ matrix.package_target }}
      # Build/package checks run everywhere; full runtime validation is currently Linux x86_64 only.
      PROJECT_BALLOON_PLATFORM_TEST_STATUS: linux-x86_64-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "${{ matrix.target }}" in
            x86_64-*) expected='x86_64' ;;
            aarch64-*) expected='aarch64' ;;
            *) echo "unsupported target architecture: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          # macOS on Apple Silicon reports arm64 via uname -m; Linux reports aarch64.
          normalized="$actual"
          [ "$normalized" = "arm64" ] && normalized='aarch64'
          [ "$normalized" = "$expected" ] || {
            echo "runner architecture $actual does not match target ${{ matrix.target }}" >&2
            exit 1
          }
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: matrix.runtime_images
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
        working-directory: frontend/web
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(tr -d '[:space:]' < VERSION)"
          [ "$actual" = "$expected" ] || {
            echo "VERSION ($actual) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          }
      - name: Build target binaries and frontend
        run: scripts/release/build-binaries.sh
      - name: Build Judge Runtime images
        if: matrix.runtime_images
        run: scripts/build-judge-runtimes.sh
      - name: Export Judge Runtime images
        if: matrix.runtime_images
        run: scripts/release/export-judge-images.sh
      - name: Create release archive
        run: |
          set -euo pipefail
          if [ "${{ matrix.package_kind }}" = deployment ]; then
            scripts/release/make-binary-package.sh
          else
            scripts/release/make-portable-package.sh
          fi
          package_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'project-balloon-*' -print -quit)"
          [ -n "$package_dir" ] || { echo 'release package directory was not created' >&2; exit 1; }
          package="$(basename "$package_dir")"
          archive="dist/$package.tar.gz"
          tar -C dist -czf "$archive" "$package"
          tar -tzf "$archive" >/dev/null
          (
            cd "$package_dir"
            sha256sum -c PACKAGE-SHA256SUMS
          )
          if [ "${{ matrix.package_kind }}" = deployment ]; then
            (
              cd "$package_dir"
              bash -n install.sh scripts/backup/*.sh scripts/lib/*.sh
              ./install.sh --help >/dev/null
            )
          fi
          (cd dist && sha256sum "$(basename "$archive")" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.package_target }}
          path: dist/project-balloon-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release checksums
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -name 'project-balloon-*.tar.gz' -print -quit | grep -q .
          (cd dist && sha256sum project-balloon-*.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            Platform validation notice: only Linux x86_64 has been tested end to end.
            Linux arm64, macOS, and Windows artifacts contain build/package checks only and are not runtime- or installation-validated yet.
          files: |
            dist/project-balloon-*.tar.gz
            dist/SHA256SUMS
