name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # This is the only platform currently tested end to end.
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_target: linux-amd64
            package_kind: deployment
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_target: linux-arm64
            package_kind: deployment
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            package_target: macos-x86_64
            package_kind: portable
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            package_target: macos-arm64
            package_kind: portable
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            package_target: windows-x86_64
            package_kind: portable
    defaults:
      run:
        shell: bash
    env:
      PROJECT_BALLOON_BINARY_TARGET: ${{ matrix.target }}
      PROJECT_BALLOON_PACKAGE_TARGET: ${{ matrix.package_target }}
      # Build/package checks run everywhere; full runtime validation is currently Linux x86_64 only.
      PROJECT_BALLOON_PLATFORM_TEST_STATUS: linux-x86_64-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "${{ matrix.target }}" in
            x86_64-*) expected='x86_64' ;;
            aarch64-*) expected='aarch64' ;;
            *) echo "unsupported target architecture: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          # macOS on Apple Silicon reports arm64 via uname -m; Linux reports aarch64.
          normalized="$actual"
          [ "$normalized" = "arm64" ] && normalized='aarch64'
          [ "$normalized" = "$expected" ] || {
            echo "runner architecture $actual does not match target ${{ matrix.target }}" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
        working-directory: frontend/web
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(tr -d '[:space:]' < VERSION)"
          [ "$actual" = "$expected" ] || {
            echo "VERSION ($actual) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          }
      - name: Build target binaries and frontend
        run: scripts/release/build-binaries.sh
      - name: Create release archive
        run: |
          set -euo pipefail
          if [ "${{ matrix.package_kind }}" = deployment ]; then
            scripts/release/make-binary-package.sh
          else
            scripts/release/make-portable-package.sh
          fi
          package_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'project-balloon-*' -print -quit)"
          [ -n "$package_dir" ] || { echo 'release package directory was not created' >&2; exit 1; }
          package="$(basename "$package_dir")"
          archive="dist/$package.tar.gz"
          tar -C dist -czf "$archive" "$package"
          tar -tzf "$archive" >/dev/null
          (
            cd "$package_dir"
            sha256sum -c PACKAGE-SHA256SUMS
          )
          if [ "${{ matrix.package_kind }}" = deployment ]; then
            (
              cd "$package_dir"
              bash -n install.sh scripts/backup/*.sh scripts/lib/*.sh
              ./install.sh --help >/dev/null
            )
          fi
          (cd dist && sha256sum "$(basename "$archive")" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.package_target }}
          path: dist/project-balloon-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  judge-images:
    name: Judge Runtime images (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            package_target: linux-amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            package_target: linux-arm64
    env:
      PROJECT_BALLOON_PACKAGE_TARGET: ${{ matrix.package_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          normalized="$actual"
          [ "$normalized" = "arm64" ] && normalized='aarch64'
          case "${{ matrix.package_target }}" in
            *-amd64) expected='x86_64' ;;
            *-arm64) expected='aarch64' ;;
            *) echo "unsupported package target: ${{ matrix.package_target }}" >&2; exit 1 ;;
          esac
          [ "$normalized" = "$expected" ] || {
            echo "runner architecture $actual does not match target ${{ matrix.package_target }}" >&2
            exit 1
          }
      - name: Build Judge Runtime images
        run: scripts/build-judge-runtimes.sh
      - name: Export Judge Runtime images
        run: scripts/release/export-judge-images.sh
      - name: Package Judge Runtime images
        run: scripts/release/make-judge-images-package.sh
      - name: Verify Judge Runtime image archive
        run: |
          set -euo pipefail
          archive="$(find dist -mindepth 1 -maxdepth 1 -type f -name '*judge-images*.tar.gz' -print -quit)"
          [ -n "$archive" ] || { echo 'judge images archive was not created' >&2; exit 1; }
          tar -tzf "$archive" >/dev/null
          (cd dist && sha256sum "$(basename "$archive")" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: judge-images-${{ matrix.package_target }}
          path: dist/project-balloon-*-judge-images.tar.gz
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    # Release gate: CI does not run on tag pushes, so without this job a tag on
    # a red commit could be published. It resolves the tagged commit and polls
    # the Checks API until every required CI check-run on that exact SHA
    # completes, passing only when all of them succeeded. CI is triggered by
    # pushes to main, so tag releases from main only: the gate is fail-closed
    # and fails (fast on any failed check, else by timeout) when the tagged
    # commit has no complete set of CI check runs. Keep REQUIRED_CHECKS in sync
    # with the job names in ci.yml.
    name: CI success gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REQUIRED_CHECKS: |-
        Rust checks
        Integration checks
        Coverage summary
        Frontend checks
        API compatibility snapshot
        Dependency and license checks
        Judge runtime build (judge-runtime-c)
        Judge runtime build (judge-runtime-cpp)
        Judge runtime build (judge-runtime-java)
        Judge runtime build (judge-runtime-python)
        Compose configuration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for required CI checks on the tagged commit
        run: |
          set -euo pipefail
          # An empty required list would make this gate pass vacuously.
          [ -n "${REQUIRED_CHECKS//[[:space:]]/}" ] || {
            echo 'CI gate misconfigured: REQUIRED_CHECKS is empty' >&2
            exit 1
          }
          sha="$(git rev-parse "HEAD^{commit}")"
          echo "Gating release on required CI checks for commit $sha"
          # CI's slowest job times out at 60 minutes; poll well past that so a
          # tag pushed while CI is still running waits instead of failing.
          deadline=$(( $(date +%s) + 110 * 60 ))
          # If no check runs exist at all shortly after the tag push, the
          # commit was never covered by CI (tags do not trigger it).
          grace_deadline=$(( $(date +%s) + 15 * 60 ))
          saw_any_check=0
          while :; do
            # Transient Checks API errors are retried on the next poll.
            if gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
                --jq '.check_runs[] | [.id, .name, .status, (.conclusion // "")] | @tsv' \
                > check_runs.tsv; then
              [ -s check_runs.tsv ] && saw_any_check=1
            else
              echo 'Checks API request failed; retrying on the next poll'
              : > check_runs.tsv
            fi
            # A job name can appear several times (re-runs); gate on the most
            # recent attempt, which is the one with the highest check-run id.
            declare -A latest_id=() latest_state=()
            while IFS=$'\t' read -r id name status conclusion; do
              [ -n "$name" ] || continue
              if [ "${latest_id[$name]:-0}" -lt "$id" ]; then
                latest_id[$name]=$id
                latest_state[$name]="${status}:${conclusion}"
              fi
            done < check_runs.tsv
            missing=() pending=() failed=()
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              state="${latest_state[$name]:-}"
              if [ -z "$state" ]; then
                missing+=("$name")
              elif [ "$state" = 'completed:success' ]; then
                :
              elif [ "${state%%:*}" = 'completed' ]; then
                failed+=("$name [$state]")
              else
                pending+=("$name [$state]")
              fi
            done < <(printf '%s\n' "$REQUIRED_CHECKS")
            if [ "${#failed[@]}" -gt 0 ]; then
              echo "CI gate failed: required checks did not succeed on $sha:" >&2
              printf '  - %s\n' "${failed[@]}" >&2
              exit 1
            fi
            if [ "${#missing[@]}" -eq 0 ] && [ "${#pending[@]}" -eq 0 ]; then
              echo "CI gate passed: all required checks succeeded on $sha"
              exit 0
            fi
            if [ "$saw_any_check" -eq 0 ] && [ "$(date +%s)" -ge "$grace_deadline" ]; then
              echo "CI gate failed: no CI check runs exist for $sha after 15 minutes." >&2
              echo 'CI only runs on pushes to main, so tags must point at commits CI covered; re-tag a green main commit.' >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "CI gate timed out after 110 minutes waiting for CI on $sha (fail-closed):" >&2
              printf '  missing: %s\n' "${missing[*]:-}" >&2
              printf '  pending: %s\n' "${pending[*]:-}" >&2
              exit 1
            fi
            echo "Waiting for CI on $sha: ${#missing[@]} missing, ${#pending[@]} pending; polling again in 30s"
            sleep 30
          done

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci-gate, package, judge-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: judge-images-*
          path: dist
          merge-multiple: true
      - name: Create release checksums
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -name 'project-balloon-*.tar.gz' -print -quit | grep -q .
          (cd dist && sha256sum project-balloon-*.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            Per-platform binary packages: linux-amd64, linux-arm64, macos-x86_64, macos-arm64, windows-x86_64.
            Judge Runtime images are published separately for linux-amd64 and linux-arm64 as
            project-balloon-<version>-<target>-judge-images.tar.gz; extract the matching archive and pass
            its judge-images directory to install.sh with --judge-images.

            Platform validation notice: only Linux x86_64 has been tested end to end.
            Linux arm64, macOS, and Windows artifacts contain build/package checks only and are not runtime- or installation-validated yet.
          files: |
            dist/project-balloon-*.tar.gz
            dist/SHA256SUMS
