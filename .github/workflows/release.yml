name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
        working-directory: frontend/web
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(tr -d '[:space:]' < VERSION)"
          [ "$actual" = "$expected" ] || {
            echo "VERSION ($actual) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          }
      - run: scripts/release/build-binaries.sh
      - run: scripts/build-judge-runtimes.sh
      - run: scripts/release/export-judge-images.sh
      - name: Create binary release archive
        run: |
          scripts/release/make-binary-package.sh
          version="$(tr -d '[:space:]' < VERSION)"
          target="$(sed -n 's/^PROJECT_BALLOON_TARGET=//p' dist/binary-staging/metadata/release.env)"
          package="project-balloon-${version}-${target}"
          archive="dist/${package}.tar.gz"
          tar -C dist -czf "$archive" "$package"
          tar -tzf "$archive" >/dev/null
          (
            cd "dist/$package"
            sha256sum -c PACKAGE-SHA256SUMS
            bash -n install.sh scripts/backup/*.sh scripts/lib/*.sh
            ./install.sh --help >/dev/null
          )
          (cd dist && sha256sum "$(basename "$archive")" > SHA256SUMS)
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/project-balloon-*.tar.gz
            dist/SHA256SUMS
