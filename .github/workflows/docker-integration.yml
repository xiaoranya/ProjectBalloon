name: Docker integration

# Runs nightly and on demand. PRs get the environment-backed integration suite
# by adding the `ci:docker-integration` label; the job is skipped otherwise so
# ordinary PRs do not pay for the full Docker stack on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:docker-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_BALLOON_IT_DIAGNOSTICS_DIR: ${{ github.workspace }}/.project-balloon-diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cups cups-filters
          echo /usr/sbin >> "$GITHUB_PATH"
          export PATH="/usr/sbin:$PATH"
          test -x /usr/sbin/cupsfilter
          test -f /usr/share/ppd/cupsfilters/Generic-PDF_Printer-PDF.ppd
      - name: Build Judge Runtime images
        run: scripts/build-judge-runtimes.sh
      - run: scripts/test/docker-integration.sh
      - name: Upload Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-integration-diagnostics
          path: ${{ github.workspace }}/.project-balloon-diagnostics
          if-no-files-found: ignore
