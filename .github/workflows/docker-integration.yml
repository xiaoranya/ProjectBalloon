name: Docker integration

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_BALLOON_IT_DIAGNOSTICS_DIR: ${{ github.workspace }}/.project-balloon-diagnostics
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cups-client cups-filters
          test -x "$(command -v cupsfilter)"
          test -f /usr/share/ppd/cupsfilters/Generic-PDF_Printer-PDF.ppd
      - name: Build Judge Runtime images
        run: scripts/build-judge-runtimes.sh
      - run: scripts/test/docker-integration.sh
      - name: Upload Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-integration-diagnostics
          path: ${{ github.workspace }}/.project-balloon-diagnostics
          if-no-files-found: ignore
