name: Docker integration

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_BALLOON_IT_DIAGNOSTICS_DIR: ${{ github.workspace }}/.project-balloon-diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cups cups-filters
          echo /usr/sbin >> "$GITHUB_PATH"
          export PATH="/usr/sbin:$PATH"
          test -x /usr/sbin/cupsfilter
          test -f /usr/share/ppd/cupsfilters/Generic-PDF_Printer-PDF.ppd
      - name: Build Judge Runtime images
        run: scripts/build-judge-runtimes.sh
      - run: scripts/test/docker-integration.sh
      - name: Upload Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-integration-diagnostics
          path: ${{ github.workspace }}/.project-balloon-diagnostics
          if-no-files-found: ignore
