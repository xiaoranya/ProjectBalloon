name: Feature request
description: Propose a new capability or improvement for the contest platform.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. Before submitting:

        - Search [existing issues](https://github.com/xiaoranya/ProjectBalloon/issues?q=is%3Aissue) and closed ones to avoid duplicates.
        - Scope proposals to the platform itself (contest management, judging, frontend, deployment, docs).
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: |
        What contest workflow, judging scenario, or operational task is
        currently hard or impossible? Describe it from a user or operator
        perspective, not just a solution shape.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What you want to happen. Mention the affected area if known
        (API, judge worker, frontend, deployment, docs). For API changes,
        note whether the external contract in `crates/contracts` would need a
        new version.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds, and why they are insufficient.
  - type: textarea
    id: impact
    attributes:
      label: Impact and scope
      description: |
        Who benefits (contestants, judges/admins, deployers) and any
        compatibility, offline-first, or sandbox-security constraints the
        design must respect.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing and closed issues and found no duplicate.
          required: true
        - label: I am willing to help implement or test this if accepted.
